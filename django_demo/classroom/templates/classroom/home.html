<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Django课堂留言板</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #dddddd;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #217dbb;
        }

        .time {
            color: #888888;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>课堂留言板</h1>

        <div class="card">
            <h2>发表留言</h2>

            <form method="post">
                {% csrf_token %}

                <label>你的姓名</label>
                <input
                    type="text"
                    name="name"
                    maxlength="50"
                    placeholder="请输入姓名"
                    required
                >

                <label>留言内容</label>
                <textarea
                    name="content"
                    rows="4"
                    placeholder="请输入留言内容"
                    required
                ></textarea>

                <button type="submit">提交留言</button>
            </form>
        </div>

        <h2>历史留言</h2>

        {% for message in messages %}
            <div class="card">
                <h3>{{ message.name }}</h3>

                <p>{{ message.content }}</p >

                <p class="time">
                    发布时间：{{ message.create_time|date:"Y-m-d H:i:s" }}
                </p >
            </div>

        {% empty %}
            <div class="card">
                <p>目前还没有留言，快来发表第一条留言吧！</p >
            </div>
        {% endfor %}

    </div>
</body>
</html>
